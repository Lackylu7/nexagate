    <main class="legal-page">
      <section class="subpage-hero compact">
        <p class="section-label" data-zh="法律" data-en="Legal">法律</p>
        <h1 data-zh="隐私政策" data-en="Privacy policy">隐私政策</h1>
        <p data-zh="本页面说明 NexaGate 如何处理账号资料、API 调用记录和安全日志。" data-en="This page explains how NexaGate handles account data, API usage records, and security logs.">本页面说明 NexaGate 如何处理账号资料、API 调用记录和安全日志。</p>
      </section>
      <section class="legal-content">
        <article>
          <h2 data-zh="账号数据" data-en="Account data">账号数据</h2>
          <p data-zh="NexaGate 可能保存账号资料、API Key 元数据、预付费余额、用量统计和安全日志。" data-en="NexaGate may store account profile, API key metadata, prepaid balance, usage totals, and security logs.">NexaGate 可能保存账号资料、API Key 元数据、预付费余额、用量统计和安全日志。</p>
        </article>
        <article>
          <h2 data-zh="请求数据" data-en="Prompt data">请求数据</h2>
          <p data-zh="API 请求会发送到已开通模型服务。请避免提交密钥、隐私身份信息或受监管数据。" data-en="Requests are sent to enabled model services. Avoid submitting secrets, private identity data, or regulated data.">API 请求会发送到已开通模型服务。请避免提交密钥、隐私身份信息或受监管数据。</p>
        </article>
        <article>
          <h2 data-zh="支付数据" data-en="Payment data">支付数据</h2>
          <p data-zh="支付服务商可能处理交易信息。NexaGate 不应保存完整银行卡信息。" data-en="Payment processors may handle transaction details. NexaGate should not store full card data.">支付服务商可能处理交易信息。NexaGate 不应保存完整银行卡信息。</p>
        </article>
        <article>
          <h2 data-zh="安全" data-en="Security">安全</h2>
          <p data-zh="API Key 应妥善保管，泄露后及时停用或轮换，不要写进公开客户端代码。" data-en="API keys should be protected, rotated after exposure, and never embedded in public client-side code.">API Key 应妥善保管，泄露后及时停用或轮换，不要写进公开客户端代码。</p>
        </article>
      </section>
    </main>
  </body>
